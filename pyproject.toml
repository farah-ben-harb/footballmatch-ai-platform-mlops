[project]
name = "footballmatch-ai-platform"
version = "0.1.0"
description = "Local MLOps and AI platform for football match video analysis"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.0",
    "opencv-python>=4.10,<5",
    "uvicorn[standard]>=0.35.0",
    "pydantic-settings>=2.10.0",
    "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "httpx2>=2.12.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
