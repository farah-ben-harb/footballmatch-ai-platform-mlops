[project]
name = "footballmatch-ai-platform"
version = "0.1.0"
description = "Local MLOps and AI platform for football match video analysis"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.0",
    "mlflow>=2.17,<3",
    "opencv-python>=4.10,<5",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35.0",
    "pydantic-settings>=2.10.0",
    "prometheus-client>=0.22,<1",
    "psycopg[binary]>=3.3,<4",
    "sentence-transformers>=6.2,<7",
    "scikit-learn>=1.7,<2",
    "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "httpx>=0.28,<1",
    "ruff>=0.12.0",
]

kubeflow = [
    "kfp>=2,<3",
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
