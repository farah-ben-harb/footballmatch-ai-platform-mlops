services:
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    extra_hosts:
      - "footballmatch-k3s-api:${K3S_API_SERVICE_IP:?set K3S_API_SERVICE_IP in .env}"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - "${OBSERVABILITY_DATA_DIR:-/data/footballmatch-observability}/prometheus:/prometheus"
    mem_limit: 768m
    cpus: 0.5
    restart: unless-stopped

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.4
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - "${OBSERVABILITY_DATA_DIR:-/data/footballmatch-observability}/grafana:/var/lib/grafana"
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./helm/footballmatch-ai-platform/dashboards:/etc/grafana/dashboards:ro
    mem_limit: 768m
    cpus: 0.5
    restart: unless-stopped
