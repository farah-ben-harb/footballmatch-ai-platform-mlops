replicaCount: 1

image:
  repository: ghcr.io/farah-ben-harb/footballmatch-ai-platform-mlops
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

containerPort: 8000

config:
  runtimeDirectory: /app/runtime

  mlflowTrackingUri: http://mlflow:5000

  detectorModelUri: models:/FootballMatchYOLODetector@champion

  rag:
    autoIndex: "false"

    database:
      host: postgres
      port: "5432"
      name: football_rag
      user: footballmatch

    ollama:
      url: http://ollama:11434
      model: gemma3:1b

    huggingFaceCache: /app/runtime/huggingface

secret:
  existingSecret: footballmatch-ai-secrets

persistence:
  enabled: true
  mountPath: /app/runtime
  size: 10Gi

  accessModes:
    - ReadWriteOnce

  storageClass: ""

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /ready
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

podSecurityContext:
  runAsNonRoot: true

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
