apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "footballmatch-ai.fullname" . }}-config

  labels:
    {{- include "footballmatch-ai.labels" . | nindent 4 }}

data:
  FOOTBALLMATCH_RUNTIME_DIRECTORY: {{ .Values.config.runtimeDirectory | quote }}

  MLFLOW_TRACKING_URI: {{ .Values.config.mlflowTrackingUri | quote }}

  FOOTBALLMATCH_DETECTOR_MODEL_URI: {{ .Values.config.detectorModelUri | quote }}

  FOOTBALLMATCH_RAG_AUTO_INDEX: {{ .Values.config.rag.autoIndex | quote }}

  FOOTBALLMATCH_RAG_DB_HOST: {{ .Values.config.rag.database.host | quote }}
  FOOTBALLMATCH_RAG_DB_PORT: {{ .Values.config.rag.database.port | quote }}
  FOOTBALLMATCH_RAG_DB_NAME: {{ .Values.config.rag.database.name | quote }}
  FOOTBALLMATCH_RAG_DB_USER: {{ .Values.config.rag.database.user | quote }}

  FOOTBALLMATCH_OLLAMA_URL: {{ .Values.config.rag.ollama.url | quote }}
  FOOTBALLMATCH_OLLAMA_MODEL: {{ .Values.config.rag.ollama.model | quote }}

  HF_HOME: {{ .Values.config.rag.huggingFaceCache | quote }}
