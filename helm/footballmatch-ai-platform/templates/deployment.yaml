apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "footballmatch.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "footballmatch.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "footballmatch.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "footballmatch.name" . }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "footballmatch.fullname" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: runtime
              mountPath: /app/runtime
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: {{ include "footballmatch.fullname" . }}-runtime
