name: footballmatch-ai-platform

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
      POSTGRES_USER: ${POSTGRES_USER:-footballmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:15432:5432"
    volumes:
      - postgres-vector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mlflow:
    build:
      context: ./docker/mlflow
    command:
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg2://${POSTGRES_USER:-footballmatch}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mlflow}
      - --serve-artifacts
      - --artifacts-destination
      - /mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      FOOTBALLMATCH_ENVIRONMENT: compose
      FOOTBALLMATCH_MLFLOW_TRACKING_URI: http://mlflow:5000
      FOOTBALLMATCH_DETECTOR_MODEL_URI: "${FOOTBALLMATCH_DETECTOR_MODEL_URI:-}"
      FOOTBALLMATCH_MLFLOW_EXPERIMENT_NAME: football-video-analysis
      FOOTBALLMATCH_GIT_COMMIT: "${FOOTBALLMATCH_GIT_COMMIT:-unknown}"
      FOOTBALLMATCH_GIT_DIRTY: "${FOOTBALLMATCH_GIT_DIRTY:-unknown}"
      FOOTBALLMATCH_APP_VERSION: "${FOOTBALLMATCH_APP_VERSION:-unknown}"
      FOOTBALLMATCH_RUNTIME_DIRECTORY: /app/runtime
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - api-runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-vector-data:
  api-runtime:
  mlflow-artifacts:
  postgres-data:
