apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: footballmatch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/farah-ben-harb/footballmatch-ai-platform-mlops.git
    targetRevision: main
    path: helm/footballmatch-ai-platform
    helm:
      releaseName: footballmatch
      values: |
        image:
          repository: ghcr.io/farah-ben-harb/footballmatch-ai-platform-mlops
          digest: sha256:ec9c0d5d2130fc5f7e8353a9f87af43103d1cc1b069f9d59383b476bd889ae53
          pullPolicy: IfNotPresent
        imagePullSecrets:
          - name: ghcr-pull
        config:
          mlflowTrackingUri: http://172.17.0.1:5000
          rag:
            autoIndex: "true"
            database:
              host: 172.17.0.1
              port: "15432"
            ollama:
              url: http://172.17.0.1:11434
        secret:
          existingSecret: footballmatch-rag-db
  destination:
    server: https://kubernetes.default.svc
    namespace: footballmatch
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
